<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achados E Perdidos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            <p>Achados <span style="color: #00ffff">&</span> Perdidos</p>
        </div>
    </header>

    <main>
        <div class="left">
            <h2>Achados e perdidos</h2>
            <p>Busque um item que você perdeu na lista, ou marque um item como perdido</p>
        </div>
        <div class="right">
            <p>Visão geral</p>
            <br>

            <div class="counter">
                <div class="perdidos">
                    <p id="perdidos">0</p>
                    <p>Itens</p>
                </div>
                <div class="devolvidos">
                    <p id="devolvidos">0</p>
                    <p>Devolvidos</p>
                </div>
                <div class="pendentes">
                    <p id="pendentes">0</p>
                    <p>Pendentes</p>
                </div>
            </div>
        </div>
    </main>

    <div class="filtros">
        <div class="nome">
            <input id="nome" type="text" placeholder="Pesquisar item perdido...">
        </div>

        <div class="categorias">
            <label for="todos">📁 Todos</label>
            <input type="radio" name="todos" id="todos" value="">
            <label for="eletronicos">⚡Eletrônicos</label>
            <input type="radio" name="categoria" id="eletronicos" value="⚡Eletrônicos">

            <label for="materiais">📗 Materiais</label>
            <input type="radio" name="categoria" id="materiais" value="📗 Materiais">

            <label for="acessorios">👓 Acessórios</label>
            <input type="radio" name="categoria" id="acessorios">

            <label for="outros">✨ Outros</label>
            <input type="radio" name="categoria" id="outros">

        </div>
    </div>

    <div id="lista"></div>

    <script src="scr/api/supabase.js"></script>
    <script src="scr/api/manage.js"></script>


    <script src="script.js"></script>

</body>

</html>
