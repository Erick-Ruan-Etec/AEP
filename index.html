<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achados e Perdidos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            <p>Achados <span>&</span> Perdidos</p>
        </div>
        <a href="login.html" class="login">Login</a>
        <button id="btnAdicionar">Adicionar item</button>
    </header>

    <main>
        <div class="left">
            <h2>Achados e Perdidos</h2>
            <p>Busque um item retido na lista ou verifique o status de devolução.</p>
        </div>
    </main>

    <div class="filtros">
        <div class="nome">
            <input id="nome" type="text" placeholder="Pesquisar item perdido...">
        </div>

        <div class="categorias">
            <input type="radio" name="categoria" id="todos" value="0" checked>
            <label for="todos">Todos</label>

            <input type="radio" name="categoria" id="eletronicos" value="1">
            <label for="eletronicos">Eletrônicos</label>

            <input type="radio" name="categoria" id="materiais" value="2">
            <label for="materiais">Materiais</label>

            <input type="radio" name="categoria" id="acessorios" value="3">
            <label for="acessorios">Acessórios</label>

            <input type="radio" name="categoria" id="outros" value="4">
            <label for="outros">Outros</label>
        </div>
    </div>

    <div id="lista"></div>

    <script src="scr/api/supabase.js"></script>
    <script src="scr/api/manage.js"></script>

    <script src="script.js"></script>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script src="itens.js"></script>
</body>

</html>
