<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@uploadcare/file-uploader@1/web/uc-file-uploader-regular.min.css">

    <script type="module">
        import * as UC from "https://cdn.jsdelivr.net/npm/@uploadcare/file-uploader@1/web/uc-file-uploader-regular.min.js";

        UC.defineComponents(UC);
    </script>


    <uc-config ctx-name="my-uploader" dynamic-button-view-mode="plain" source-list="local, camera, dropbox, gdrive"
        cdn-cname="https://5tibc5o33j.ucarecd.net/" pubkey="5c159b6ef4b0d281c52f"></uc-config>


    <uc-file-uploader-regular ctx-name="my-uploader" class="uc-light" dynamic-button></uc-file-uploader-regular>


    <uc-upload-ctx-provider ctx-name="my-uploader"></uc-upload-ctx-provider>


    <input type="text" id="imagem-url" placeholder="A URL aparecerá aqui" readonly>


    <script type="module">

        const uploader = document.querySelector(
            "uc-file-uploader-regular"
        );

        const urlInput = document.getElementById(
            "imagem-url"
        );


        uploader.addEventListener(
            "common-upload-success",
            (event) => {

                console.log("UPLOAD:");
                console.log(event);

                console.log("DETAIL:");
                console.log(event.detail);

            }
        );

    </script>
</body>

</html>
