<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="file" id="imagem" accept="image/*">
    <button id="upload">Enviar imagem</button>

    <p id="resultado"></p>

    <script>
        const input = document.getElementById("imagem");
        const botao = document.getElementById("upload");
        const resultado = document.getElementById("resultado");

        botao.addEventListener("click", async () => {
            const arquivo = input.files[0];

            if (!arquivo) {
                resultado.textContent = "Selecione uma imagem.";
                return;
            }

            const formData = new FormData();
            formData.append("image", arquivo);

            try {
                botao.disabled = true;
                resultado.textContent = "Enviando...";

                const resposta = await fetch("/api/upload", {
                    method: "POST",
                    body: formData
                });

                const dados = await resposta.json();

                if (!resposta.ok || !dados.success) {
                    throw new Error(dados.error || "Upload falhou.");
                }

                // URL retornada pela sua API
                const url = dados.url;

                console.log("URL:", url);

                resultado.textContent = url;

            } catch (erro) {
                console.error(erro);
                resultado.textContent = erro.message || "Erro ao enviar a imagem.";

            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>

</html>
